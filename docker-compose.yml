# MHTT development stack on the LAN dev server, next to AIIS's (own
# containers, volumes and ports 8169/8172). Production: deploy/.
name: mhtt

services:
  db:
    image: postgres:16
    container_name: mhtt-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mhtt-db:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:17
    container_name: mhtt-app
    depends_on:
      - db
    ports:
      - "0.0.0.0:8169:8069"
      - "0.0.0.0:8172:8072"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD}
    volumes:
      - mhtt-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped

volumes:
  mhtt-db:
  mhtt-web-data:
